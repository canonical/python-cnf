[metadata]
name = python-cnf
version = 0.0.3
description = Python support for the cnf configuration format
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/canonical/python-cnf
author = Gustavo Niemeyer
license = Apache-2.0
license_files = LICENSE
keywords = cnf, config, json, parser
classifiers =
    Development Status :: 5 - Production/Stable
    Intended Audience :: Developers
    Operating System :: OS Independent
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Programming Language :: Python :: 3.13
    Topic :: Software Development :: Libraries
project_urls =
    Documentation = https://github.com/canonical/python-cnf
    Issues = https://github.com/canonical/python-cnf/issues

[options]
python_requires = >=3.10
packages =
    cnfembed
